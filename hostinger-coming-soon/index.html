<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Siya Ram Fabrics</title>
  <meta name="description" content="Siya Ram Fabrics - Website Launching Soon. Family textile business since 1998 in Ludhiana.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #111111;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background-color: #E5484D;
      color: #ffffff;
    }

    /* Ambient Background Glows */
    .glow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(177, 33, 55, 0.22) 0%, rgba(177, 33, 55, 0) 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    .glow-corner {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(229, 72, 77, 0.15) 0%, rgba(229, 72, 77, 0) 70%);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }

    /* Glassmorphic Card */
    .card {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2.25rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: default;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(229, 72, 77, 0.4);
      box-shadow: 0 30px 70px rgba(229, 72, 77, 0.2);
      transform: translateY(-4px);
    }

    /* Inner Glow */
    .inner-glow {
      position: absolute;
      top: -4rem;
      right: -4rem;
      width: 150px;
      height: 150px;
      background: rgba(229, 72, 77, 0.15);
      border-radius: 50%;
      filter: blur(35px);
      pointer-events: none;
      transition: all 0.7s ease;
    }

    .card:hover .inner-glow {
      background: rgba(229, 72, 77, 0.3);
      transform: scale(1.4);
    }

    /* Logo */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.75rem;
      position: relative;
      z-index: 10;
    }

    .logo {
      height: 70px;
      width: auto;
      object-contain: contain;
      filter: brightness(0) invert(1);
      transition: transform 0.5s ease;
    }

    .card:hover .logo {
      transform: scale(1.04);
    }

    /* Pill Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(229, 72, 77, 0.1);
      border: 1px solid rgba(229, 72, 77, 0.6);
      color: #E5484D;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(229, 72, 77, 0.2);
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }

    .card:hover .badge {
      box-shadow: 0 0 25px rgba(229, 72, 77, 0.45);
      transform: scale(1.03);
    }

    .badge svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Heading */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.15rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 0.85rem;
      position: relative;
      z-index: 10;
    }

    h1 span {
      color: #E5484D;
    }

    /* Subtext */
    p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      font-weight: 300;
      transition: color 0.3s ease;
      position: relative;
      z-index: 10;
    }

    .card:hover p {
      color: rgba(255, 255, 255, 0.95);
    }

    /* Footer Copyright note */
    .brand-foot {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.25rem 1.5rem;
      }
      h1 {
        font-size: 1.75rem;
      }
      .logo {
        height: 55px;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="glow-center"></div>
  <div class="glow-corner"></div>

  <!-- Card Component -->
  <div class="card">
    <div class="inner-glow"></div>
    
    <!-- Logo -->
    <div class="logo-container">
      <img src="logo.png" alt="Siya Ram Fabrics Logo" class="logo">
    </div>

    <!-- Badge -->
    <div class="badge">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
      </svg>
      Website Launching Soon
    </div>

    <!-- Content -->
    <h1>Something Great Is <span>Coming Soon</span></h1>
    <p>Siya Ram Fabrics is crafting a new digital experience. Our new website will be live shortly.</p>

    <!-- Footer mark -->
    <div class="brand-foot">
      Siya Ram Fabrics &bull; Ludhiana, Punjab
    </div>
  </div>
</body>
</html>
